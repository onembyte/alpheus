name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Linux release binary
        run: cargo build --release --bin alpheus
        working-directory: src-tauri

      - name: Package Linux release archive
        run: |
          mkdir -p dist/alpheus-linux-x86_64
          cp src-tauri/target/release/alpheus dist/alpheus-linux-x86_64/
          cp alpheus.desktop dist/alpheus-linux-x86_64/ 2>/dev/null || true
          cp -r plugins/alpheus dist/alpheus-linux-x86_64/ 2>/dev/null || true
          cp scripts/install.sh dist/alpheus-linux-x86_64/ 2>/dev/null || true
          cp README.md LICENSE dist/alpheus-linux-x86_64/ 2>/dev/null || true
          tar -czvf dist/alpheus-linux-x86_64.tar.gz -C dist alpheus-linux-x86_64

      - name: Upload Linux Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/alpheus-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build macOS CLI binary
        run: cargo build --release --bin alpheus
        working-directory: src-tauri

      - name: Package macOS CLI
        run: |
          mkdir -p dist/alpheus-macos
          cp src-tauri/target/release/alpheus dist/alpheus-macos/
          cp README.md LICENSE dist/alpheus-macos/ 2>/dev/null || true
          tar -czvf dist/alpheus-macos.tar.gz -C dist alpheus-macos

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/alpheus-macos.tar.gz
