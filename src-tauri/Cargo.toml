[package]
name = "alpheus"
version = "0.6.1"
description = "Honest storage pane for a chronically full MacBook"
authors = ["Franco Michetti"]
edition = "2021"

[lib]
name = "alpheus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tauri-plugin-autostart = "2"

[profile.release]
strip = true
lto = true
