[package]
name = "alpheus"
version = "0.8.0"
description = "Honest storage pane for a chronically full MacBook"
authors = ["Franco Michetti"]
edition = "2021"

[lib]
name = "alpheus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tauri-plugin-autostart = "2"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
crossterm = "0.28"
sha2 = "0.10"

[[bin]]
name = "alpheus"
path = "src/bin/alpheus.rs"

[[bin]]
name = "alpheus-app"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
