[package]
name = "alpheus"
version = "0.8.3"
description = "Honest storage pane for a chronically full MacBook"
authors = ["Franco Michetti"]
edition = "2021"

[lib]
name = "alpheus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tauri-plugin-autostart = "2"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
crossterm = "0.28"
sha2 = "0.10"

# Order and naming here are both load-bearing for `tauri build --target
# universal-apple-darwin`: it runs `lipo` on the binary named after the
# *package*, but bundles the *last* [[bin]] entry. The GUI has to be both, or
# the DMG silently ships the wrong executable — it shipped the CLI until
# v0.8.3, because the CLI held the package name.
[[bin]]
name = "alpheus-cli"
path = "src/bin/alpheus-cli.rs"

[[bin]]
name = "alpheus"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
